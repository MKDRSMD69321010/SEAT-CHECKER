<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>심야자습 좌석 대조 및 관리 프로그램</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eaeaea; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: #2c3e50; }
        #realtime-clock { font-size: 15px; font-weight: bold; color: #e74c3c; background: #fadbd8; padding: 6px 12px; border-radius: 20px; }
        .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        textarea { width: 100%; height: 140px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        .btn-container { text-align: center; margin-bottom: 30px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin: 0 5px; }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #616a6b; }
        .result-section { background: #f9fbfc; border: 1px solid #e1e8ed; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .result-section h3 { margin-top: 0; color: #2c3e50; border-bottom: 1px solid #dcdcdc; padding-bottom: 8px; }
        .floor-group { margin-bottom: 15px; }
        .floor-title { font-weight: bold; color: #16a085; margin-bottom: 5px; }
        .seat-badge { display: inline-block; background: #e8f8f5; border: 1px solid #a3e4d7; color: #0e6251; padding: 4px 10px; margin: 3px; border-radius: 15px; font-size: 14px; position: relative; }
        .count-badge { background: #e74c3c; color: white; font-size: 10px; padding: 1px 5px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }
        
        /* 모달 스타일 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 30px; border-radius: 10px; width: 80%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #000; }
        .log-item { background: #fdfefe; border: 1px solid #d5dbdb; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .log-header { font-weight: bold; color: #2980b9; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .delete-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <h1>심야자습 좌석 대조 및 관리</h1>
        <div id="realtime-clock">실시간 시계 로딩중...</div>
    </div>

    <div class="input-section">
        <div class="input-group">
            <label for="appliedSeats">심야자습 신청 좌석 (예: 2-020)</label>
            <textarea id="appliedSeats" placeholder="좌석 번호를 입력하세요 (엔터 또는 쉼표 구분)"></textarea>
        </div>
        <div class="input-group">
            <label for="activeSeats">실제 공부 중인 좌석 (예: 2-020)</label>
            <textarea id="activeSeats" placeholder="좌석 번호를 입력하세요 (엔터 또는 쉼표 구분)"></textarea>
        </div>
    </div>

    <div class="btn-container">
        <button onclick="compareSeats()">층별 좌석 대조 및 분류하기</button>
        <button class="secondary" onclick="openLogModal()">[심야자습 신청기록]</button>
    </div>

    <div id="resultContainer" style="display:none;">
        <div class="result-section">
            <h3>미신청 공부자 (신청하지 않았으나 공부 중인 좌석)</h3>
            <div id="unregResult"></div>
        </div>
        <div class="result-section">
            <h3>신청 후 하원자 (신청했으나 공부하지 않는 좌석)</h3>
            <div id="leftResult"></div>
        </div>
    </div>
</div>

<!-- 기록 모달 -->
<div id="logModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeLogModal()">&times;</span>
        <h2 style="margin-top:0; color:#2c3e50;">심야자습 신청기록 (구글 스프레드시트 동기화)</h2>
        <div style="margin-bottom: 15px;">
            <button class="delete-btn" style="padding: 8px 15px; font-size: 14px;" onclick="deleteAllLogs()">기록 전체 삭제</button>
        </div>
        <div id="logListContainer">기록을 불러오는 중...</div>
    </div>
</div>

<script>
    // 구글 앱스크립트 웹 앱 URL 연동
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5-7fqB3JgRXD9i2J3V57-VXnDDpI71KQc79ihfXG45YD3RNoMMa5m99sC-t8Ohs0Y2g/exec";
    const DEVICE_NAME = "근무지PC_" + Math.floor(Math.random() * 1000); // 기기 자동 식별명

    // 실시간 시계 (요일 포함)
    function updateClock() {
        const now = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        const dayName = days[now.getDay()];
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('realtime-clock').innerText = 
            `${year}.${month}.${date} (${dayName}) ${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 좌석 형식 유효성 검사 함수 (숫자-숫자 형식, 예: 2-020, 2-1-1 등)
    function isValidSeatFormat(seat) {
        const regex = /^\d+-\d{1,3}(-\d{1,3})?$/;
        return regex.test(seat.trim());
    }

    function parseSeats(text) {
        return text.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
    }

    // 이번 달 적발 횟수 계산용 전체 기록 불러오기
    let globalRecords = [];

    async function fetchRecords() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            globalRecords = data;
        } catch (e) {
            console.error("데이터 로드 실패:", e);
        }
    }
    fetchRecords();

    // 이번 달 특정 좌석의 누적 적발 횟수 계산
    function getThisMonthCount(seat) {
        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}`;
        let count = 0;

        globalRecords.forEach(rec => {
            if (rec.timestamp.startsWith(currentYearMonth)) {
                try {
                    let unregObj = JSON.parse(rec.unreg || "{}");
                    let leftObj = JSON.parse(rec.left || "{}");
                    
                    for (let floor in unregObj) {
                        if (unregObj[floor].includes(seat)) count++;
                    }
                    for (let floor in leftObj) {
                        if (leftObj[floor].includes(seat)) count++;
                    }
                } catch(e) {}
            }
        });
        return count;
    }

    // 그룹화 및 렌더링 헬퍼
    function groupAndRender(seats, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        
        if (seats.length === 0) {
            container.innerHTML = "<p style='color:#7f8c8d; font-style:italic;'>해당하는 좌석이 없습니다.</p>";
            return;
        }

        const groups = {};
        seats.forEach(seat => {
            const floor = seat.split('-')[0] + "층";
            if (!groups[floor]) groups[floor] = [];
            groups[floor].push(seat);
        });

        for (let floor in groups) {
            const floorDiv = document.createElement('div');
            floorDiv.className = 'floor-group';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'floor-title';
            titleDiv.innerText = `[${floor}]`;
            floorDiv.appendChild(titleDiv);

            groups[floor].forEach(seat => {
                const badge = document.createElement('span');
                badge.className = 'seat-badge';
                const count = getThisMonthCount(seat);
                badge.innerHTML = `${seat} <span class="count-badge" title="이번 달 적발 횟수">이번 달 ${count}회</span>`;
                floorDiv.appendChild(badge);
            });
            container.appendChild(floorDiv);
        }
    }

    async function compareSeats() {
        const appliedRaw = document.getElementById('appliedSeats').value;
        const activeRaw = document.getElementById('activeSeats').value;

        const appliedList = parseSeats(appliedRaw);
        const activeList = parseSeats(activeRaw);

        // 유효성 검사
        const allSeats = [...appliedList, ...activeList];
        for (let seat of allSeats) {
            if (!isValidSeatFormat(seat)) {
                alert(`오류: "${seat}"은(는) 올바른 좌석 형식(예: 2-020)이 아닙니다. 정확한 형식으로 입력해주세요.`);
                return;
            }
        }

        const unregList = activeList.filter(s => !appliedList.includes(s)).sort();
        const leftList = appliedList.filter(s => !activeList.includes(s)).sort();

        // 중복 제거 및 오름차순 정렬
        const unregUnique = [...new Set(unregList)];
        const leftUnique = [...new Set(leftList)];

        groupAndRender(unregUnique, 'unregResult');
        groupAndRender(leftUnique, 'leftResult');
        document.getElementById('resultContainer').style.display = 'block';

        // 타임스탬프 생성 (요일 포함)
        const now = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const timestamp = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}. (${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        // 층별 데이터 객체화 저장
        const formatByFloor = (list) => {
            const obj = {};
            list.forEach(s => {
                const f = s.split('-')[0] + "층";
                if (!obj[f]) obj[f] = [];
                obj[f].push(s);
            });
            return obj;
        };

        const payload = {
            action: "save",
            deviceName: DEVICE_NAME,
            timestamp: timestamp,
            applied: JSON.stringify(formatByFloor(appliedList)),
            active: JSON.stringify(formatByFloor(activeList)),
            unreg: JSON.stringify(formatByFloor(unregUnique)),
            left: JSON.stringify(formatByFloor(leftUnique))
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result.status === "duplicate") {
                alert("동일한 값이 같은 일자에 기록되어 있습니다.");
            }
            fetchRecords(); // 최신 기록 갱신
        } catch (e) {
            console.error("저장 실패:", e);
        }
    }

    // 모달 제어
    async function openLogModal() {
        document.getElementById('logModal').style.display = 'block';
        await fetchRecords();
        renderLogs();
    }

    function closeLogModal() {
        document.getElementById('logModal').style.display = 'none';
    }

    function renderLogs() {
        const container = document.getElementById('logListContainer');
        container.innerHTML = "";

        if (globalRecords.length === 0) {
            container.innerHTML = "<p>저장된 신청기록이 없습니다.</p>";
            return;
        }

        globalRecords.forEach((rec) => {
            const item = document.createElement('div');
            item.className = 'log-item';

            let unregStr = "", leftStr = "", appliedStr = "", activeStr = "";
            try {
                const parseObj = (str) => {
                    let obj = JSON.parse(str || "{}");
                    let res = [];
                    for (let f in obj) res.append ? null : res.push(`[${f}: ${obj[f].join(', ')}]`);
                    return res.join(', ');
                };
                // 간단 포맷 변환
                const formatDetailed = (str) => {
                    let obj = JSON.parse(str || "{}");
                    let txt = "";
                    for (let f in obj) {
                        txt += `<b>${f}</b>: ${obj[f].join(', ')} | `;
                    }
                    return txt || "없음";
                };

                appliedStr = formatDetailed(rec.applied);
                activeStr = formatDetailed(rec.active);
                unregStr = formatDetailed(rec.unreg);
                leftStr = formatDetailed(rec.left);
            } catch(e) {
                unregStr = rec.unreg;
                leftStr = rec.left;
            }

            item.innerHTML = `
                <div class="log-header">
                    <span>📅 ${rec.timestamp} <span style="font-size:11px; color:#7f8c8d;">(${rec.deviceName || 'PC'})</span></span>
                    <button class="delete-btn" onclick="deleteRow('${rec.timestamp}')">개별 삭제</button>
                </div>
                <div style="font-size:13px; line-height:1.5; color:#555;">
                    <div><b>1. 심야자습 신청 좌석:</b> ${appliedStr}</div>
                    <div><b>2. 실제 공부 중인 좌석:</b> ${activeStr}</div>
                    <div><b>3. 미신청 공부자:</b> <span style="color:#c0392b;">${unregStr}</span></div>
                    <div><b>4. 신청 후 하원자:</b> <span style="color:#e67e22;">${leftStr}</span></div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    async function deleteRow(timestamp) {
        if (!confirm(`[${timestamp}] 기록을 삭제하시겠습니까?`)) return;
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteRow", timestamp: timestamp })
            });
            await fetchRecords();
            renderLogs();
        } catch(e) {
            alert("삭제 중 오류가 발생했습니다.");
        }
    }

    async function deleteAllLogs() {
        if (!confirm("모든 기록을 삭제하시겠습니까? (복구할 수 없습니다)")) return;
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteAll" })
            });
            globalRecords = [];
            renderLogs();
            alert("전체 기록이 삭제되었습니다.");
        } catch(e) {
            alert("전체 삭제 중 오류가 발생했습니다.");
        }
    }

    window.onclick = function(event) {
        const modal = document.getElementById('logModal');
        if (event.target == modal) {
            closeLogModal();
        }
    }
</script>

</body>
</html>
